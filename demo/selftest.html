<!doctype html>
<meta charset="utf-8">
<title>Nukemichi self-test</title>
<pre id="out">loading</pre>
<script type="module">
// Phase 0 proofs through the public API. Driven by bench/safari.mjs
// (WebDriver) and usable by hand: open with ?transport=webrtc&run=1.
import { createClient } from '../js/src/index.js';
window.runPhase0 = async ({ transport = 'webrtc', worker = true } = {}) => {
  const r = { userAgent: navigator.userAgent, transport, worker };
  const logs = [];
  const t0 = performance.now();
  const c = createClient({ transport, worker, storage: 'memory', logLevel: 'info', log: (l, t, m) => logs.push(`${((performance.now() - t0) / 1000).toFixed(1)}s ${l} ${m}`) });
  try {
    r.boot = await c.ready();
    r.bootMs = Math.round(performance.now() - t0);
    r.isTor = await (await c.fetch('https://check.torproject.org/api/ip')).json();
    try { await fetch('https://example.com/'); r.plainFetch = 'succeeded?'; } catch (e) { r.plainFetch = `${e.name}: ${e.message}`; }
    const res = await c.fetch('https://example.com/');
    const body = await res.text();
    r.torFetch = { status: res.status, bytes: body.length, title: body.match(/<title>(.*?)<\/title>/)?.[1] };
    const s = await c.connect('tcpbin.com', 4242);
    const w = s.writable.getWriter(); const rd = s.readable.getReader();
    const t1 = performance.now();
    await w.write(new TextEncoder().encode('safari-echo\n'));
    const { value } = await rd.read();
    r.tcpEcho = { got: new TextDecoder().decode(value).trim(), ms: Math.round(performance.now() - t1) };
    r.stats = await c.stats();
  } catch (e) {
    r.error = `${e.name}: ${e.message}`;
  }
  r.logTail = logs.filter((l) => !/debug/.test(l)).slice(-15);
  await c.close().catch(() => {});
  document.getElementById('out').textContent = JSON.stringify(r, null, 1);
  return r;
};
document.getElementById('out').textContent = 'ready';
const q = new URLSearchParams(location.search);
if (q.get('run')) window.runPhase0({ transport: q.get('transport') ?? 'webrtc', worker: q.get('worker') !== '0' });
</script>
