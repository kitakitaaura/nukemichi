<!doctype html>
<meta charset="utf-8">
<title>Nukemichi example</title>
<script src="https://cdn.jsdelivr.net/npm/nukemichi@0.1/js/src/global.js"></script>

<input id="url" value="https://check.torproject.org/api/ip" size="50">
<button id="go">Fetch through Tor</button>
<pre id="out">Starting Tor…</pre>

<script>
  const out = document.getElementById('out');
  nukemichi.ready().then(
    () => { out.textContent = 'Tor is ready.'; },
    (e) => { out.textContent = 'Tor failed to start: ' + e.message; }
  );
  document.getElementById('go').onclick = async () => {
    out.textContent = 'Fetching…';
    try {
      const res = await nukemichi.fetch(document.getElementById('url').value);
      out.textContent = res.status + '\n\n' + (await res.text());
    } catch (e) {
      out.textContent = 'Error: ' + e.message;
    }
  };
</script>
